<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="robots" content="noindex">
	<style>
		html,
		body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
		}

		p {
			margin: 0;
		}

		h1 {
			margin: 0;
		}

		a {
			color: inherit;
			text-decoration: underline;
		}

		.monospace {
			font-family: 'IBM Plex Mono', monospace;
		}

		.bold {
			font-weight: bold;
		}

		.sr-only {
			position: absolute;
			width: 1px;
			height: 1px;
			padding: 0;
			margin: -1px;
			overflow: hidden;
			clip-path: inset(50%);
			white-space: nowrap;
			border-width: 0;
		}

		.report {
			box-sizing: border-box;
			display: flex;
			flex-direction: column;
			height: 100%;
			font-family: 'IBM Plex Sans', sans-serif;
			background-color: oklch(21% 0.034 264.665);
			color: white;
			padding: 1rem;
			gap: 1rem;
		}

		.entry {
			max-width: 40rem;
			border: 3px solid white;
		}

		.entry header {
			background-color: oklch(44.2% 0.017 285.786);
			padding: 0.5rem;
			display: flex;
			flex-direction: column;
		}

		.header-top {
			display: flex;
			justify-content: space-between;
		}

		.header-bottom {
			display: flex;
			justify-content: space-between;
		}
		
		.entry-body {
			font-family: 'IBM Plex Serif', serif;
			white-space: pre-wrap;
			padding: 1rem;
			background-color: oklch(27.4% 0.006 286.033);
		}

		.reason-container {
			display: flex;
			flex-direction: column;
			gap: 1rem;
		}

		#reason {
			font-family: 'IBM Plex Sans', sans-serif;
			resize: vertical;
			background-color: oklch(27.4% 0.006 286.033);
			color: white;
			padding: 0.5rem;
			height: 4rem;
			max-width: calc(40rem - (2 * 0.5rem) + (2 * 3px));
		}
	</style>
</head>
<body>
	<article class="report">
		<h1>Report guestbook entry</h1>
		<p>You are reporting the following entry:</p>
		<article class="entry">
			<h3 class="sr-only">Guestbook Entry</h3>
			<header>
				<div class="header-top">
					<span class="monospace">[{{entry.id}}]</span>
					<time class="monospace" datetime="{{ entry.createdRaw }}">{{ entry.created }}</time>
				</div>
				<div class="header-bottom">
					<span class="bold">{{ entry.name }}</span>
					<div class="monospace">
						[<a href="/guestbook/report?id={{ entry.id }}">Report</a>]
					</div>
				</div>
			</header>
			<p class="entry-body">{{ entry.message }}</p>
		</article>
		<form class="reason-container" method="post">
			<label for="reason">Reason for reporting:</label>
			<input type="hidden" name="id" value="{{ entry.id }}">
			<textarea id="reason" name="reason" placeholder="Enter your reason here..." maxlength="512"></textarea>
			<div>
				<button type="submit">Submit Report</button>
				<a href="/guestbook" style="margin-left: 1rem;">Cancel</a>
			</div>
		</form>
	</article>
</body>
</html>
