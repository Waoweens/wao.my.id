<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="robots" content="noindex">

	<style>
		html,
		body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
		}

		p {
			margin: 0;
		}

		h2 {
			margin: 0;
			margin-bottom: 1rem;
			font-size: large;
		}

		a {
			color: inherit;
			text-decoration: underline;
		}

		.guestbook {
			box-sizing: border-box;
			font-family: 'IBM Plex Sans', sans-serif;
			display: flex;
			height: 100%;
			/* background-color: oklch(27.8% 0.033 256.848); */
			background-color: oklch(21% 0.034 264.665);
			color: white;
		}

		.monospace {
			font-family: 'IBM Plex Mono', monospace;
		}

		.bold {
			font-weight: bold;
		}

		.between {
			display: flex;
			justify-content: space-between;
		}

		.sr-only {
			position: absolute;
			width: 1px;
			height: 1px;
			padding: 0;
			margin: -1px;
			overflow: hidden;
			clip-path: inset(50%);
			white-space: nowrap;
			border-width: 0;
		}

		.submit-container {
			width: 18rem;
			padding: 1rem;
			border-right: 3px solid white;
		}

		#submit-form {
			display: flex;
			flex-direction: column;
			gap: 0.5rem;
		}

		.name-container {
			display: flex;
			gap: 0.5rem;
			align-items: center;
		}

		#name {
			font-family: 'IBM Plex Sans', sans-serif;
			flex: 1;
			background-color: oklch(44.2% 0.017 285.786);
			color: white;
			padding: 0.25rem;
			font-weight: bold;
		}

		.message-container {
			display: flex;
			flex-direction: column;
			gap: 0.25rem;
		}

		#message {
			font-family: 'IBM Plex Serif', serif;
			resize: vertical;
			background-color: oklch(27.4% 0.006 286.033);
			color: white;
			padding: 0.5rem;
			height: 10rem;
		}

		#submit-form:has(#anonymous:checked) #name {
			pointer-events: none;
			opacity: 0.5;
			user-select: none;
		}


		.entries-container {
			flex: 1;
			min-height: 0;
			overflow-y: auto;
		}

		.entries {
			list-style-type: none;
			margin: 0;
			padding: 0;
			display: flex;
			flex-direction: column;
		}

		.entries li {
			border-bottom: 3px solid white;
		}

		.entries header {
			background-color: oklch(44.2% 0.017 285.786);
			padding: 0.5rem;
			display: flex;
			flex-direction: column;
		}

		.header-top {
			display: flex;
			justify-content: space-between;
		}

		.header-bottom {
			display: flex;
			justify-content: space-between;
		}
		
		.entry-body {
			font-family: 'IBM Plex Serif', serif;
			white-space: pre-wrap;
			padding: 1rem;
			background-color: oklch(27.4% 0.006 286.033);
		}

		@media (max-width: 40rem) {

			html,
			body {
				overflow: auto;
			}

			.guestbook {
				flex-direction: column;
				height: auto;
			}

			.submit-container {
				box-sizing: border-box;
				padding: 0;
				border: none;
				width: 100%;
				padding: 1rem;
				border-bottom: 3px solid white;
			}

			.entries-container {
				padding: 0;
				overflow: visible;
			}

			#message {
				height: 5rem;
			}
		}
	</style>
</head>

<body>
	<article class="guestbook">
		<h1 class="sr-only">Guestbook</h1>
		<section class="submit-container">
			<h2>Submit your message</h2>
			<noscript>
				<p>JavaScript disabled. Everything should still function.</p>
			</noscript>
			<form id="submit-form" method="post">
				<div>
					<input type="checkbox" id="anonymous" name="anonymous" checked>
					<label for="anonymous">Post anonymously</label>
				</div>
				<div class="name-container">
					<label for="name">Name:</label>
					<input type="text" id="name" name="name" maxlength="128">
				</div>
				<div class="message-container">
					<label for="message">Message:</label>
					<textarea id="message" name="message" required maxlength="512"></textarea>
					<span id="message-length">0 / 512</span>
				</div>
				<div>
					<button type="submit">Submit</button>
				</div>
			</form>
		</section>
		<section class="entries-container">
			<ul class="entries">
				<h2 class="sr-only">Guestbook Entries</h2>
				{% for entry in entries %}
				<li>
					<article>
						<h3 class="sr-only">Guestbook Entry</h3>
						<header>
							<div class="header-top">
								<span class="monospace">[{{entry.id}}]</span>
								<time class="monospace" datetime="{{ entry.createdRaw }}">{{ entry.created }}</time>
							</div>
							<div class="header-bottom">
								<span class="bold">{{ entry.name }}</span>
								<div class="monospace">
									[<a href="/guestbook/report?id={{ entry.id }}">Report</a>]
								</div>
							</div>
						</header>
						<p class="entry-body">{{ entry.message }}</p>
					</article>
				</li>
				{% endfor %}
			</ul>
		</section>
	</article>

	<script>
		const anonymous = document.getElementById('anonymous');
		const name = document.getElementById('name');
		const message = document.getElementById('message');
		const messageLength = document.getElementById('message-length');

		name.disabled = true;
		anonymous.addEventListener('change', function () {
			if (this.checked) {
				name.disabled = true;
				name.value = '';
			} else {
				name.disabled = false;
			}
		});

		message.addEventListener('input', function () {
			messageLength.textContent = `${this.value.length} / 512`;
		});

		// make oneko.js track mouse in iframe
		// https://github.com/adryd325/oneko.js/issues/30#issuecomment-3237848920
		// plus my additions for cross-origin iframes
		document.addEventListener("mousemove", event => {
			window.parent.postMessage({
				type: "mousemove",
				x: event.clientX,
				y: event.clientY
			}, "*");
		});
	</script>
</body>

</html>
