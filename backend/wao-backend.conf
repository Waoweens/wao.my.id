server {
	listen 443 ssl;
	server_name backend.wao.my.id;
	ssl_certificate /etc/nginx/ssl/wao.my.id/origin_certificate.pem;
	ssl_certificate_key /etc/nginx/ssl/wao.my.id/private_key.key;

	location / {
		proxy_pass http://127.0.0.1:8101;

		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		proxy_redirect off;
		proxy_buffering off;
	}
}

server {
	listen 80;
	server_name backend.wao.my.id;
	return 307 https://$host$request_uri;
}