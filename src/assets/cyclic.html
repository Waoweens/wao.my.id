<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyclic Permutation - A, B, C</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
        }

        .container {
            position: relative;
            width: 300px;
            height: 300px;
        }

        .circle {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: rotate 3s linear infinite;
        }

        .letter {
            position: absolute;
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            animation: counter-rotate 3s linear infinite;
        }

        /* Position letters around the circle */
        .letter:nth-child(1) {
            top: 0;
            left: 50%;
            transform: translateX(-50%);
        }

        .letter:nth-child(2) {
            top: 50%;
            right: 0;
            transform: translateY(-50%);
        }

        .letter:nth-child(3) {
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes counter-rotate {
            from {
                transform: rotate(0deg) translateX(-50%);
            }
            to {
                transform: rotate(-360deg) translateX(-50%);
            }
        }

        .letter:nth-child(2) {
            animation: counter-rotate-right 3s linear infinite;
        }

        @keyframes counter-rotate-right {
            from {
                transform: rotate(0deg) translateY(-50%);
            }
            to {
                transform: rotate(-360deg) translateY(-50%);
            }
        }

        .title {
            position: absolute;
            top: -80px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            white-space: nowrap;
        }

        .subtitle {
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.9);
            font-size: 16px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">Cyclic Permutation</div>
        <div class="circle">
            <div class="letter">A</div>
            <div class="letter">B</div>
            <div class="letter">C</div>
        </div>
        <div class="subtitle">A → B → C → A</div>
    </div>
</body>
</html>
